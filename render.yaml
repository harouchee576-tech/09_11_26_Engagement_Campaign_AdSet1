services:
  - type: web
    name: harou-generator-api
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: PUBLIC_API_URL
        sync: false
      - key: HAROU_API_KEY
        generateValue: true
      - key: HAROU_SESSION_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: RATE_LIMIT_RPM
        value: "180"
